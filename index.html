  menubar.appendChild(timeEl);
  var desk = h("main", {"class": "desk", "aria-label": name + " desktop"}, [h("div", {"class": "wall", "aria-hidden": "true"})]);
  var stampText = sty.lines && str(sty.lines.stamp, 24);
  if (stampText) desk.appendChild(h("div", {"class": "stamp", "aria-hidden": "true", text: stampText}));
  var icons = h("ul", {"class": "icons", "aria-label": "Desktop icons"});
  var winLayer = h("div", {"class": "windows"});
  desk.appendChild(icons); desk.appendChild(winLayer);
  document.body.appendChild(menubar); document.body.appendChild(desk);

  // ---------- windows ----------
  var wins = {}, z = 20, count = 0;
  function front(w) { z += 1; w.style.zIndex = z; }
  function clampPos(w, x, y) {
    var maxX = Math.max(8, desk.clientWidth - w.offsetWidth - 8), maxY = Math.max(8, desk.clientHeight - 60);
    return [Math.round(Math.min(Math.max(8, x), maxX)), Math.round(Math.min(Math.max(8, y), maxY))];
  }
  function place(w, x, y, save) {
    var p = clampPos(w, x, y); w.style.left = p[0] + "px"; w.style.top = p[1] + "px";
    if (save) store.set(KEY + "pos:" + w.id, JSON.stringify(p));
  }
  function saved(w) {
    var raw = store.get(KEY + "pos:" + w.id);
    try { var p = raw ? JSON.parse(raw) : null; return Array.isArray(p) && p.length === 2 ? p : null; }
    catch (err) { return null; }
  }
  function openWin(id, opener) {
    var w = wins[id]; if (!w) return;
    w.hidden = false; w.opener = opener || w.opener; front(w);
    if (desktopMode.matches) { var p = saved(w) || w.home; place(w, p[0], p[1], false); }
    if (opener) opener.setAttribute("aria-expanded", "true");
    w.querySelector(".bar").focus({preventScroll: desktopMode.matches});
    if (!desktopMode.matches && opener) w.scrollIntoView({block: "start"});
  }
  function closeWin(w) {
    w.hidden = true;
    if (w.opener) { w.opener.setAttribute("aria-expanded", "false"); w.opener.focus(); }
  }
  function makeWin(id, title, body, opt) {
    opt = opt || {};
    var tid = id + "-title", bar = h("div", {"class": "bar", tabindex: "0", "aria-label": title + ". Drag, or use the arrow keys, to move this window."});
    if (motif === "y2k-blog") bar.appendChild(h("span", {"class": "lights", "aria-hidden": "true"}, [h("i"), h("i"), h("i")]));
    if (motif === "cyberpunk") bar.appendChild(h("span", {"class": "leds", "aria-hidden": "true"}, [h("i"), h("i")]));
    bar.appendChild(h("h2", {id: tid, text: motif === "cyberpunk" ? "~/" + title.toLowerCase() : title}));
    var x = h("button", {"class": "x", type: "button", "aria-label": "Close " + title, text: "x"});
    bar.appendChild(x);
    var w = h("section", {"class": "win" + (opt.cls ? " " + opt.cls : ""), id: id, role: "dialog", "aria-labelledby": tid}, [bar]);
    if (motif === "analog") { w.insertBefore(h("span", {"class": "tape l", "aria-hidden": "true"}), bar); w.appendChild(h("span", {"class": "tape r", "aria-hidden": "true"})); }
    if (motif === "cyberpunk") w.appendChild(h("p", {"class": "prompt", "aria-hidden": "true"}, [slug + ":~$ open " + title.toLowerCase(), h("span", {"class": "cursor"})]));
    w.appendChild(h("div", {"class": "wbody"}, body));
    if (opt.width) w.style.width = opt.width + "px";
    w.home = opt.home || [230 + count * 34, 40 + count * 28]; count += 1;
    w.hidden = !opt.open;
    x.addEventListener("click", function () { closeWin(w); });
    w.addEventListener("pointerdown", function () { front(w); });
    w.addEventListener("keydown", function (e) { if (e.key === "Escape") { e.preventDefault(); closeWin(w); } });
    bar.addEventListener("keydown", function (e) {
      var step = e.shiftKey ? 64 : 16, d = {ArrowLeft: [-step, 0], ArrowRight: [step, 0], ArrowUp: [0, -step], ArrowDown: [0, step]}[e.key];
      if (!d || !desktopMode.matches) return;
      e.preventDefault(); place(w, w.offsetLeft + d[0], w.offsetTop + d[1], true);
    });
    bar.addEventListener("pointerdown", function (e) {
      if (!desktopMode.matches || e.target.closest(".x") || e.button !== 0) return;
      var dx = e.clientX - w.offsetLeft, dy = e.clientY - w.offsetTop;
      bar.setPointerCapture(e.pointerId);
      function move(ev) { place(w, ev.clientX - dx, ev.clientY - dy, false); }
      function up() { bar.removeEventListener("pointermove", move); bar.removeEventListener("pointerup", up); place(w, w.offsetLeft, w.offsetTop, true); }
      bar.addEventListener("pointermove", move); bar.addEventListener("pointerup", up);
    });
    winLayer.appendChild(w); wins[id] = w;
    return w;
  }
  function addIcon(id, label, glyph, parent) {
    var b = h("button", {"class": "icon", type: "button", "aria-controls": id, "aria-expanded": "false"}, [h("span", {"class": "glyph " + glyph, "aria-hidden": "true"}), h("span", {"class": "label", text: label})]);
    b.addEventListener("click", function () { openWin(id, b); });
    (parent || icons).appendChild(parent ? b : h("li", {}, [b]));
    return b;
  }

  // ---------- welcome ----------
  var welcome = [h("h1", {text: name})];
  if (motif === "analog") welcome.push(h("span", {"class": "datestamp", text: new Date(built + "T12:00:00").toLocaleDateString("en-GB", {day: "2-digit", month: "short", year: "numeric"}).toUpperCase()}));
  if (str(cfg.tagline)) welcome.push(h("p", {text: str(cfg.tagline)}));
  if (str(cfg.mood, 80)) welcome.push(h("p", {"class": "mood", text: "mood: ✧ " + str(cfg.mood, 80)}));
  var chips = h("ul", {"class": "chips"});
  list(cfg.links).slice(0, 8).forEach(function (l) { var a = l && link(str(l.label, 40) || "link", l.url); if (a) chips.appendChild(h("li", {}, [a])); });
  if (chips.children.length) welcome.push(chips);
  makeWin("w-welcome", name, welcome, {open: true, cls: "welcome", home: [130 + 110, 24], width: 420});
  who.addEventListener("click", function () { openWin("w-welcome", who); });

  // ---------- folders (offers) ----------
  list(cfg.folders).slice(0, 10).forEach(function (f, i) {
    var label = str(f && f.name, 40); if (!label) return;
    var body = [];
    if (str(f.blurb)) body.push(h("p", {text: str(f.blurb)}));
    var items = list(f.items).map(function (t) { return str(t, 120); }).filter(Boolean);
    if (items.length) body.push(h("ul", {}, items.map(function (t) { return h("li", {text: t}); })));
    var a = link(str(f.cta, 40) || "open", f.url, "btn"); if (a) body.push(a);
    makeWin("w-folder-" + i, label, body);
    addIcon("w-folder-" + i, label, "folder");
  });

  // ---------- currently ----------
  var now = cfg.currently && typeof cfg.currently === "object" ? cfg.currently : {};
  var rows = Object.keys(now).slice(0, 6).filter(function (k) { return str(now[k], 120); });
  if (rows.length) {
    var dl = h("dl", {"class": "now"});
    rows.forEach(function (k) { dl.appendChild(h("dt", {text: str(k, 24)})); dl.appendChild(h("dd", {text: str(now[k], 120)})); });
    makeWin("w-currently", "currently", [dl], {open: true, home: [690, 40], width: 280});
    addIcon("w-currently", "currently", "book");
  }

  // ---------- guestbook ----------
  var gb = link("sign my guestbook", cfg.guestbookUrl, "btn");
  if (gb) { makeWin("w-guestbook", "guestbook", [h("p", {text: "Thank you for stopping by."}), gb], {width: 320}); addIcon("w-guestbook", "guestbook", "page"); }

  // ---------- clock widget: books a call ----------
  var clock = cfg.clock && typeof cfg.clock === "object" ? cfg.clock : {};
  var hh = h("span", {"class": "hand h"}), mm = h("span", {"class": "hand m"}), digits = h("time", {"class": "digits"});
  var widget = h("aside", {"class": "clock", "aria-label": "Clock"}, [h("div", {"class": "face", "aria-hidden": "true"}, [hh, mm]), digits]);
  var book = link(str(clock.label, 40) || "book a call", clock.url, "btn");
  if (book) widget.appendChild(book);
  desk.insertBefore(widget, winLayer);
  function tick() {
    var d = new Date(), hr = d.getHours(), mi = d.getMinutes(), t = String(hr).padStart(2, "0") + ":" + String(mi).padStart(2, "0");
    hh.style.transform = "rotate(" + ((hr % 12) * 30 + mi / 2) + "deg)"; mm.style.transform = "rotate(" + mi * 6 + "deg)";
    digits.textContent = t; digits.setAttribute("datetime", t); timeEl.textContent = t;
  }
  tick(); window.setInterval(tick, 15000);

  // ---------- sticky notes (testimonials) ----------
  var notes = list(cfg.notes).slice(0, 6).filter(function (n) { return n && str(n.text); });
  if (notes.length) {
    var wrap = h("div", {"class": "notes", "aria-label": "Sticky notes"});
    notes.forEach(function (n) {
      wrap.appendChild(h("figure", {"class": "note"}, [h("blockquote", {text: str(n.text, 240)}), str(n.from, 60) ? h("figcaption", {text: str(n.from, 60)}) : null]));
    });
    desk.insertBefore(wrap, winLayer);
  }

  // ---------- trash: things I let go ----------
  var gone = list(cfg.trash).map(function (t) { return str(t, 120); }).filter(Boolean).slice(0, 12);
  if (gone.length) {
    makeWin("w-trash", "Trash", [h("p", {text: "things I let go"}), h("ul", {"class": "let-go"}, gone.map(function (t) { return h("li", {text: t}); }))], {width: 320, home: [520, 300]});
    var slot = h("div", {"class": "trash-slot"}); desk.insertBefore(slot, winLayer);
    addIcon("w-trash", "Trash", "trash", slot);
  }

  // ---------- taskbar: links, visitor counter, last updated ----------
  var visits = (parseInt(store.get(KEY + "visits"), 10) || 0) + 1; store.set(KEY + "visits", String(visits));
  var start = Number.isInteger(cfg.counter) && cfg.counter >= 0 ? cfg.counter : 777;
  var n = String(start + visits).padStart(6, "0"), shown = n.slice(0, 3) + "," + n.slice(3);
  var counterText = motif === "y2k-blog" ? "you are visitor no. " + shown : motif === "cyberpunk" ? "visits " + n : "no. " + n;
  var taskbar = h("footer", {"class": "taskbar"}, [h("span", {"class": "counter", text: counterText}), h("span", {"class": "updated", text: "last updated " + built})]);
  taskbar.appendChild(h("a", {"class": "credit", href: "https://github.com/RochaStone/desktop-core", rel: "noopener", target: "_blank", text: "made with Rocha Coded"}));
  document.body.appendChild(taskbar);

  // Keep open windows on screen when the browser is resized.
  window.addEventListener("resize", function () {
    if (!desktopMode.matches) return;
    Object.keys(wins).forEach(function (id) { var w = wins[id]; if (!w.hidden) place(w, w.offsetLeft, w.offsetTop, false); });
  });
  Object.keys(wins).forEach(function (id) { var w = wins[id]; if (!w.hidden && desktopMode.matches) { var p = saved(w) || w.home; place(w, p[0], p[1], false); front(w); } });
  root.setAttribute("data-ready", motif);
})();
</script>
</body>
</html>
